name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # nécessaire pour publier une Release sur un tag

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Installe Gradle (pas besoin de gradle wrapper dans le dépôt)
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # Le SDK Android est préinstallé sur ubuntu-latest
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MatrixWallpaper-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish GitHub Release (sur tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
